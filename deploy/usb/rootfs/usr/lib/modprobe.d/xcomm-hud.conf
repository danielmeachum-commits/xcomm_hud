# Don't load nouveau.
#
# On a hybrid laptop (an ASUS ProArt P16 here: AMD iGPU + RTX 50-series) X
# picked the NVIDIA GPU as its screen. The built-in panel is wired to the AMD
# GPU, so the desktop ran on a GPU with nothing connected and the laptop
# screen stayed on the boot text — while xcomm and Firefox ran unseen.
#
# Without nouveau, X can only take a GPU that drives a real display: the iGPU
# on hybrid machines, or the firmware framebuffer on NVIDIA-only ones (basic,
# but on whatever screen the firmware lit). xcomm needs no 3D, and nouveau
# barely supports current NVIDIA cards anyway.
blacklist nouveau
options nouveau modeset=0
