# Linger the xcomm user, so its services (the stack) start at boot instead of
# waiting for someone to log in. Equivalent to `loginctl enable-linger xcomm`.
f /var/lib/systemd/linger/xcomm 0644 root root -

# LightDM's cache directory. The lightdm package ships it in /var, but bootc
# only applies image /var content at install, and SELinux stops LightDM from
# creating it itself ("Failed to make cache directory /var/cache/lightdm").
d /var/cache/lightdm 0711 lightdm lightdm -
